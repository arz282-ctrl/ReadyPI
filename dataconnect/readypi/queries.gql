# ReadyPi Queries

# Get user profile and credit balance
query GetUserProfile @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    fullName
    planTier
    credit_on_user {
      balance
    }
  }
}

# List active API keys for the current user
query ListUserKeys @auth(level: USER) {
  apiKeys(where: { user: { id: { eq_expr: "auth.uid" } }, isActive: { eq: true } }) {
    id
    keyPrefix
    name
    environment
    lastUsedAt
  }
}

# Get recent usage logs
query GetRecentUsage($limit: Int = 10) @auth(level: USER) {
  usageLogs(
    where: { user: { id: { eq_expr: "auth.uid" } } }
    limit: $limit
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    model
    totalTokens
    creditsUsed
    status
    createdAt
  }
}
