# ReadyPi Data Connect Schema
# Synchronized with database/schema.sql

type User @table {
  id: UUID! @default(expr: "uuidV4()")
  email: String! @unique
  passwordHash: String! @col(name: "password_hash")
  fullName: String @col(name: "full_name")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
  emailVerified: Boolean! @default(value: false) @col(name: "email_verified")
  isActive: Boolean! @default(value: true) @col(name: "is_active")
  planTier: String! @default(value: "free") @col(name: "plan_tier")
}

type ApiKey @table(name: "api_keys") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  keyHash: String! @unique @col(name: "key_hash")
  keyPrefix: String! @col(name: "key_prefix")
  name: String
  environment: String! @default(value: "live")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  lastUsedAt: Timestamp @col(name: "last_used_at")
  isActive: Boolean! @default(value: true) @col(name: "is_active")
  rateLimitPerMinute: Int! @default(value: 10) @col(name: "rate_limit_per_minute")
}

type Credit @table(name: "credits") {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @unique
  balance: Int64! @default(value: 0)
  totalPurchased: Int64! @default(value: 0) @col(name: "total_purchased")
  totalUsed: Int64! @default(value: 0) @col(name: "total_used")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
}

type Transaction @table(name: "transactions") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  amountBdt: Float! @col(name: "amount_bdt")
  amountUsd: Float @col(name: "amount_usd")
  creditsAdded: Int64! @col(name: "credits_added")
  paymentMethod: String! @col(name: "payment_method")
  paymentGateway: String @col(name: "payment_gateway")
  gatewayTransactionId: String @col(name: "gateway_transaction_id")
  status: String! @default(value: "pending")
  metadata: Any
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  completedAt: Timestamp @col(name: "completed_at")
}

type UserSubscription @table(name: "subscriptions") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  planTier: String! @col(name: "plan_tier")
  status: String! @default(value: "active")
  priceBdt: Float! @col(name: "price_bdt")
  creditsPerMonth: Int64! @col(name: "credits_per_month")
  billingCycle: String! @default(value: "monthly") @col(name: "billing_cycle")
  currentPeriodStart: Date! @col(name: "current_period_start")
  currentPeriodEnd: Date! @col(name: "current_period_end")
  cancelAtPeriodEnd: Boolean! @default(value: false) @col(name: "cancel_at_period_end")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
}

type UsageLog @table(name: "usage_logs") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  apiKey: ApiKey!
  model: String!
  provider: String!
  promptTokens: Int! @col(name: "prompt_tokens")
  completionTokens: Int! @col(name: "completion_tokens")
  totalTokens: Int! @col(name: "total_tokens")
  creditsUsed: Int64! @col(name: "credits_used")
  costBdt: Float @col(name: "cost_bdt")
  requestId: String @col(name: "request_id")
  status: String! @default(value: "success")
  errorMessage: String @col(name: "error_message")
  latencyMs: Int @col(name: "latency_ms")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
}

type Referral @table(name: "referrals") {
  id: UUID! @default(expr: "uuidV4()")
  referrer: User!
  referred: User!
  referralCode: String! @unique @col(name: "referral_code")
  creditsEarned: Int64! @default(value: 0) @col(name: "credits_earned")
  status: String! @default(value: "pending")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  firstPurchaseAt: Timestamp @col(name: "first_purchase_at")
}

type ModelPricing @table(name: "model_pricing") {
  id: UUID! @default(expr: "uuidV4()")
  modelName: String! @unique @col(name: "model_name")
  provider: String!
  displayName: String! @col(name: "display_name")
  costPer1mTokensBdt: Float! @col(name: "cost_per_1m_tokens_bdt")
  costPer1mTokensUsd: Float @col(name: "cost_per_1m_tokens_usd")
  isActive: Boolean! @default(value: true) @col(name: "is_active")
  isFreeTier: Boolean! @default(value: false) @col(name: "is_free_tier")
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
}
